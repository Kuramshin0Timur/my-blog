{% extends "base.html" %}
{% block title %}Профиль{% endblock %}
{% block content %}
<h1 class="page-title">Профиль: {{ current_user.username }}</h1>

<div class="auth-card" style="margin-left:0; max-width: 560px;">
    <h2>Смена пароля</h2>
    <form method="post">
        <input type="hidden" name="action" value="password">
        <label>Текущий пароль<input type="password" name="old_password" required></label>
        <label>Новый пароль<input type="password" name="new_password" required minlength="6"></label>
        <label>Повтор<input type="password" name="new_password2" required minlength="6"></label>
        <button type="submit" class="btn-primary">Сменить пароль</button>
    </form>
</div>

<div class="auth-card" style="margin-left:0; max-width: 560px;">
    <h2>E-mail</h2>
    <form method="post">
        <input type="hidden" name="action" value="email">
        <label>E-mail<input type="email" name="email" value="{{ current_user.email }}" required></label>
        <button type="submit" class="btn-primary">Сохранить</button>
    </form>
</div>
{% endblock %}
