{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Регистрация</h1>
    <form method="post">
        <label>Имя пользователя<input type="text" name="username" required minlength="3"></label>
        <label>E-mail<input type="email" name="email" required></label>
        <label>Пароль<input type="password" name="password" required minlength="6"></label>
        <label>Повтор пароля<input type="password" name="password2" required minlength="6"></label>
        <button type="submit" class="btn-primary">Зарегистрироваться</button>
    </form>
    <p class="auth-alt">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</div>
{% endblock %}
